<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="casos-titulo casos-descricao">
  <title id="casos-titulo">Casos de uso UML: escola, administrador e responsáveis</title>
  <desc id="casos-descricao">A escola registra ocorrências. Os responsáveis consultam o registro pelo link recebido no WhatsApp. Só o administrador pode configurar os seis números e consultar os envios, após autenticar sua senha no servidor. A API WhatsApp participa somente do envio. O disparo é uma extensão do registro quando a integração está ativa.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#24364b}.moldura{fill:#fff;stroke:#6b879e;stroke-width:1.5}.titulo{font-size:23px;font-weight:bold;text-anchor:middle}.estereotipo{font-size:14px;text-anchor:middle;fill:#456177}.atributo{font:17px monospace}.relacao{fill:none;stroke:#456177;stroke-width:2}.rotulo{font-size:17px}.nota{font-size:17px;fill:#456177}.classe{cursor:pointer}.classe:hover .moldura{stroke:#12636d;stroke-width:4}</style><defs><marker id="casos-seta" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M1 1 11 6 1 11" fill="none" stroke="#456177" stroke-width="1.5"/></marker></defs>
  <rect width="1600" height="1000" fill="#f5f8fb"/>
  <text x="40" y="45" font-size="24" font-weight="bold">QUEM USA O SISTEMA E O QUE PODE FAZER</text>
  <rect x="300" y="100" width="1000" height="800" rx="12" fill="#edf4f8" stroke="#6b879e" stroke-width="2"/>
  <text x="800" y="140" text-anchor="middle" font-size="23" font-weight="bold">escola-notificação · Conviva SP</text>
  <rect x="330" y="550" width="940" height="320" rx="10" fill="#e7efff" stroke="#6b879e" stroke-dasharray="6 5"/>
  <text x="800" y="577" text-anchor="middle" font-size="18" font-weight="bold">ÁREA EXCLUSIVA DO ADM</text>
  <g fill="none" stroke="#456177" stroke-width="2"><path d="M143 235 370 270"/><path d="M1452 235 1240 270"/><path d="M143 655 360 640"/><path d="M143 655H240V790H360"/><path d="M1380 675H1340V460H1050"/></g>
  <g fill="none" stroke="#456177" stroke-width="2"><circle cx="115" cy="200" r="16"/><path d="M115 216v48m-28-29h56m-28 29-24 38m24-38 24 38"/></g><text x="115" y="332" text-anchor="middle" font-size="22" font-weight="bold">Equipe escolar</text><g fill="none" stroke="#456177" stroke-width="2"><circle cx="115" cy="620" r="16"/><path d="M115 636v48m-28-29h56m-28 29-24 38m24-38 24 38"/></g><text x="115" y="752" text-anchor="middle" font-size="22" font-weight="bold">ADM</text><g fill="none" stroke="#456177" stroke-width="2"><circle cx="1480" cy="200" r="16"/><path d="M1480 216v48m-28-29h56m-28 29-24 38m24-38 24 38"/></g><text x="1480" y="332" text-anchor="middle" font-size="22" font-weight="bold">Responsável</text>
  <ellipse cx="570" cy="270" rx="200" ry="52" fill="#fff" stroke="#6b879e" stroke-width="2"/><text x="570" y="277" text-anchor="middle" font-size="22">Registrar ocorrência</text><ellipse cx="1040" cy="270" rx="200" ry="52" fill="#fff" stroke="#6b879e" stroke-width="2"/><text x="1040" y="277" text-anchor="middle" font-size="22">Consultar ocorrência</text>
  <ellipse cx="800" cy="460" rx="250" ry="52" fill="#fff" stroke="#6b879e" stroke-width="2"/><text x="800" y="467" text-anchor="middle" font-size="22">Enviar aviso com link</text>
  <ellipse cx="570" cy="640" rx="210" ry="52" fill="#fff" stroke="#6b879e" stroke-width="2"/><text x="570" y="647" text-anchor="middle" font-size="22">Configurar seis números</text><ellipse cx="1050" cy="650" rx="210" ry="52" fill="#fff" stroke="#6b879e" stroke-width="2"/><text x="1050" y="657" text-anchor="middle" font-size="22">Autenticar ADM</text><ellipse cx="570" cy="790" rx="210" ry="52" fill="#fff" stroke="#6b879e" stroke-width="2"/><text x="570" y="797" text-anchor="middle" font-size="22">Consultar envios</text>
  <path d="M740 409 620 321" class="relacao" stroke-dasharray="7 5" marker-end="url(#casos-seta)"/>
  <text x="690" y="351" text-anchor="middle" font-size="17">«extend»</text>
  <text x="870" y="384" text-anchor="middle" font-size="17">[integração ativa]</text>
  <path d="M780 640 840 650" class="relacao" stroke-dasharray="7 5" marker-end="url(#casos-seta)"/>
  <text x="812" y="623" text-anchor="middle" font-size="16">«include»</text>
  <path d="M780 790H1050V702" class="relacao" stroke-dasharray="7 5" marker-end="url(#casos-seta)"/>
  <text x="891" y="779" text-anchor="middle" font-size="16">«include»</text>
  <text x="1050" y="832" text-anchor="middle" font-size="16">Senha validada na API</text>
  <rect x="1380" y="630" width="200" height="90" rx="8" fill="#fff" stroke="#6b879e"/>
  <text x="1480" y="660" text-anchor="middle" font-size="15">«serviço externo»</text><text x="1480" y="690" text-anchor="middle" font-size="21" font-weight="bold">API WhatsApp</text>
  <text x="40" y="953" class="nota">Somente o ADM cadastra os destinatários. Os responsáveis recebem o link no WhatsApp pessoal e abrem o registro no navegador.</text>
</svg>
